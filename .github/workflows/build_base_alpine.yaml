name: "base:ffmpeg-alpine"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - ffmpeg_version: "9.1"
            os: alpine
            os_version: "3.23"
            platforms: linux/amd64,linux/arm64,linux/arm/v7
    steps:
      - name: Get current date
        run: |
          echo "CURRENT_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Get current commit
        run: |
          echo "CURRENT_COMMIT=$(echo ${GITHUB_SHA} | head -c 7)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: image
        env:
          IMAGE_TAG: ffmpeg${{ matrix.ffmpeg_version }}-${{ matrix.os }}${{ matrix.os_version }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          if [[ -n "$DOCKERHUB_IMAGE" ]]; then
            tags+=",docker.io/${DOCKERHUB_IMAGE}:${IMAGE_TAG}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build Multi-Arch
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile.alpine
          build-args: |
            BUILD_IMAGE=${{ matrix.os }}:${{ matrix.os_version }}
            BUILD_DATE=${{ env.CURRENT_DATE }}
            BUILD_COMMIT=${{ env.CURRENT_COMMIT }}
            FFMPEG_VERSION=${{ matrix.ffmpeg_version }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
